    <path d="M 190,190 L 320,190 L 320,320 L 190,320 Z" rx="20" fill="#3B82F6" stroke="#142850" stroke-width="8"/>
    <!-- Central Sphere Highlight -->
    <circle cx="180" cy="180" r="54" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="180" cy="180" r="46" fill="#F59E0B"/>
    <circle cx="166" cy="166" r="14" fill="#FFFFFF" fill-opacity="0.8"/>
